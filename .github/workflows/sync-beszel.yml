name: Sync Beszel images
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install regctl
        run: |
          curl -fsSL -o /tmp/regctl https://github.com/regclient/regclient/releases/latest/download/regctl-linux-amd64
          sudo install -m 755 /tmp/regctl /usr/local/bin/regctl
      - env:
          ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
          ALIYUN_NAMESPACE: ${{ secrets.ALIYUN_NAMESPACE }}
          ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
          ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash sync.sh
